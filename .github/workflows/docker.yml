name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - '**'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: nix build .#dynamicrouter

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load Docker Image
        run: docker load -i result

      - name: Generate Application Source SBOM
        uses: anchore/sbom-action@v0.24.3
        with:
          path: .
          format: 'cyclonedx-json'
          output-file: 'sbom-app.cdx.json'
          upload-artifact: false

      - name: Generate Container Image SBOM
        uses: anchore/sbom-action@v0.24.3
        with:
          image: dynamicrouter:latest
          format: 'cyclonedx-json'
          output-file: 'sbom-image.cdx.json'
          upload-artifact: false

      - name: Merge Application & Container SBOMs
        env:
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: '1'
        run: |
          curl -sSfL https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.33.1/cyclonedx-linux-x64 -o /usr/local/bin/cyclonedx-cli
          chmod +x /usr/local/bin/cyclonedx-cli
          cyclonedx-cli merge --input-files sbom-app.cdx.json sbom-image.cdx.json --output-file final-sbom.cdx.json

      - name: Upload Complete SBOM Artifact
        uses: actions/upload-artifact@v7
        with:
          name: final-sbom
          path: final-sbom.cdx.json

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Tag and Push Docker Images
        id: push
        run: |
          echo "${{ steps.meta.outputs.tags }}" | while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              docker tag dynamicrouter:latest "$tag"
              docker push "$tag"
            fi
          done
          FIRST_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n 1)
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$FIRST_TAG" | awk -F'@' '{print $2}')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Attest and Attach SBOM to Image in Registry
        uses: actions/attest-sbom@v4.1.0
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: final-sbom.cdx.json
          push-to-registry: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Attach SBOM to Docker Image via Cosign
        run: |
          echo "${{ steps.meta.outputs.tags }}" | while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              cosign attach sbom --sbom final-sbom.cdx.json --type cyclonedx "$tag"
            fi
          done
