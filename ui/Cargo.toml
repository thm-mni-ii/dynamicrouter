[package]
name = "ui"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ui"
path = "src/main.rs"

[dependencies]
dioxus = { version = "0.7.10", features = ["web", "router"] }
gloo-timers = { version = "0.3", features = ["futures"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "=0.4.77"
js-sys = "=0.3.104"
web-sys = { version = "=0.3.104", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "CssStyleDeclaration",
    "Storage",
    "Location",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "Navigator",
    "Clipboard"
] }

[profile.release]
strip = true
opt-level = "z"
lto = true
