[package]
name = "dynamicrouter"
version = "0.9.1"
edition = "2024"

[dependencies]
tokio = { version = "1.44.0", features = ["rt-multi-thread", "macros", "signal"] }
axum = {version = "0.8.1", features = ["macros"]}
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
serde_json = {version = "1.0.139"}
reqwest = {version = "0.13.5", default-features = false, features = ["json", "stream", "rustls", "form"] }
async-trait = {version = "0.1.86"}
once_cell = {version = "1.20.3"}
anyhow = { version = "1.0.96" }
sqlx = { version = "0.9", default-features = false, features = ["macros", "runtime-tokio", "postgres", "sqlite", "migrate"] }
toml = { version = "1.1.8", features = ["preserve_order"] }
serde = { version = "1.0.218", features = ["derive"] }
futures-core = { version = "0.3.31" }
bytes = {version = "1.10.0"}
futures-util = { version = "0.3.31" }
log = {  version = "0.4.26" }
env_logger = { version = "0.11.6" }
url = { version = "2.5.4", features = ["serde"] }
regex = { version = "1.11.1" }
thiserror = { version = "2.0.11" }
sha2 = { version = "0.11.1" }
hex = { version = "0.4.3" }
secrecy = { version = "0.10.3", features = ["serde"] }
kube = { version = "5.0.0", default-features = false, features = ["runtime", "derive", "rustls-tls"] }
k8s-openapi = { version = "0.29.0", features = ["latest"] }
rand = { version = "0.10.3" }
rustls = { version = "0.23.23", features = ["ring"] }
uuid = { version = "1.15.1", features = ["v4"] }
base64 = "0.23.1"
chrono = { version = "0.4.39", features = ["serde"] }
rust-embed = "8.5.0"
mime_guess = "2.0.5"
dotenvy = "0.15.7"
ipnet = "2.10"
glob = "0.3"
cel = { version = "0.15.0", features = ["json"] }

[dev-dependencies]
tower = { version = "0.5.2", features = ["util"] }
http-body-util = "0.1.2"

[profile.release]
strip = true
